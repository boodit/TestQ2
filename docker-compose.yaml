services:
  db:
    image: postgres:16
    container_name: db_app
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - seabattle

  migration:
    build:
      context: .
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seabattle


  app:
    build:
      context: .
    env_file:
      - .env
    container_name: fastapi_app
    command: ["/fastapi_app/scripts/app.sh"]
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - migration
    networks:
      - seabattle

networks:
  seabattle: